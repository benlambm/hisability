<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo sheet</title>
<link rel="stylesheet" href="../css/figure.css">
<style>
  body { margin: 16px; font: 13px/1.3 system-ui, sans-serif; background: #faf9f5; color: #141413; }
  h2 { font-size: 15px; margin: 18px 0 4px; }
  .row { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 4px; }
  .label { width: 150px; flex: none; font-weight: 600; }
  .label small { display: block; font-weight: 400; color: #6b6a65; }
  .cell { width: 150px; flex: none; background: #f0ece4; border-radius: 8px; padding: 2px; }
  .cell.key { outline: 2px solid #d97757; }
  .cap { font-size: 11px; color: #555; padding: 0 4px 3px; min-height: 14px; }
  .cap.bad { color: #b3261e; font-weight: 700; }
  .err { color: #b3261e; font-weight: 700; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module" src="demo-sheet.js"></script>
</body>
</html>
